[project]
name = "agent-monitor"
version = "0.1.0"
description = "Instrumented queue in front of a local LLM — loaded/waiting metrics and token counts for Prometheus."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "prometheus-client>=0.21",
    "typer>=0.15",
]

[dependency-groups]
dev = [
    "ruff>=0.16",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# B008: Typer's Argument()/Option() are meant to be called as defaults — standard pattern, not a bug.
ignore = ["B008"]
