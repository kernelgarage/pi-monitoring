networks:
  monitoring:
    name: monitoring

services:
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: always
    networks: [monitoring]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /tmp:/textfile_collector:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.textfile.directory=/textfile_collector'
    ports:
      - "127.0.0.1:9100:9100"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    networks: [monitoring]
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml
      - ./data/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    networks: [monitoring]
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: always
    networks: [monitoring]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - ./data/loki:/loki
    command:
      - '-config.file=/etc/loki/local-config.yaml'
    ports:
      - "127.0.0.1:3100:3100"

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: always
    networks: [monitoring]
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - '-config.file=/etc/promtail/config.yaml'
    depends_on:
      - loki

  agent-monitor:
    build: ./agent-monitor
    container_name: agent_monitor
    restart: always
    networks: [monitoring]
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - AGENT_MONITOR_SLOTS=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8090:8090"

  tempo:
    # pinned: :latest currently resolves to an unreleased v3.0 rewrite with an incompatible config schema
    image: grafana/tempo:2.8.1
    container_name: tempo
    restart: always
    networks: [monitoring]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - ./data/tempo:/var/tempo
    command:
      - '-config.file=/etc/tempo.yaml'
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
